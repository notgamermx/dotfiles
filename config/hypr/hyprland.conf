# ==============================================================================
# Hyprland Configuration - Main Entry Point
# Inspired by Caelestia
# ==============================================================================

# --- Sourced Configurations ---
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf

# --- Environment Variables ---
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# --- General Appearance & Layout ---
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(313244aa)

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 12

    active_opacity = 0.95
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        blurls = waybar
        blurls = rofi
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe = true
}

# --- Auto-Start Services ---
# Launch Desktop Shell (Caelestia Shell / Waybar) via helper script
exec-once = ~/.config/hypr/../../scripts/launch-shell.sh

# Launch Video Wallpaper via helper script
exec-once = ~/.config/hypr/../../scripts/set-bg.sh

# Polkit Agent
exec-once = /usr/lib/polkit-kde-authentication-agent-1
