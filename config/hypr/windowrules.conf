# ==============================================================================
# Hyprland Window & Layer Rules
# Handles Window Opacity, Floating Rules, and Compositor-level Blur
# ==============================================================================

# --- Glassmorphism & Layer Blur Rules ---
# Enables Hyprland's native blur for status bars & application launcher layers
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, rofi
layerrule = ignorezero, rofi

# --- Window Opacity Rules ---
windowrulev2 = opacity 0.90 0.80, class:^(kitty)$
windowrulev2 = opacity 0.95 0.85, class:^(thunar)$
windowrulev2 = opacity 0.95 0.85, class:^(dolphin)$

# --- Floating Window Rules ---
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$

# --- Picture-in-Picture Rules ---
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
