# ==============================================================================
# Hyprland Animations Configuration
# Caelestia-inspired Smooth & Fluid Animation Beziers
# ==============================================================================

animations {
    enabled = true

    # Custom Bezier Curves
    bezier = fluid, 0.05, 0.9, 0.1, 1.05
    bezier = morph, 0.2, 1.0, 0.2, 1.0
    bezier = easeOutBack, 0.34, 1.56, 0.64, 1
    bezier = easeInOut, 0.42, 0, 0.58, 1
    bezier = linear, 0, 0, 1, 1

    # Animation Definitions (name, enable, speed, curve, [style])
    animation = windows, 1, 4, fluid, popin 80%
    animation = windowsIn, 1, 4, easeOutBack, popin 80%
    animation = windowsOut, 1, 3, morph, popin 80%
    animation = windowsMove, 1, 4, fluid

    animation = border, 1, 8, default
    animation = borderangle, 1, 20, linear, loop

    animation = fade, 1, 4, easeInOut
    animation = fadeDim, 1, 4, easeInOut

    animation = workspaces, 1, 5, fluid, slidefade 20%
    animation = specialWorkspace, 1, 4, fluid, slidefadevert 20%
}
